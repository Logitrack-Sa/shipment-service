name: Verificar orquestacion plataforma
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verificar red, secretos, descubrimiento y orden de arranque
        run: python3 -m unittest discover -s integration -p test_stack_compose.py -v
