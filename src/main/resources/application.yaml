spring:
  application:
    name: shipment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:logitrack}
    username: ${DB_USER:logitrack}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

logitrack:
  fee:
    base: ${FEE_BASE:1000.00}
    price-per-kg: ${FEE_PRICE_PER_KG:250.00}
    volumetric-divisor: ${FEE_VOLUMETRIC_DIVISOR:5000}

app:
  limites:
    extraccion-diaria:
      titular: 100000.00
      adherente: 70000.00
  comisiones:
    cuenta-corriente: 5000.00
    caja-ahorro: 2000.00
    cron: "0 0 0 1 * *"
  activacion:
    token-validez-horas: 24
