spring:
  cloud:
    config:
      enabled: false
  cache:
    type: simple
  datasource:
    url: jdbc:h2:mem:logitrack;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    connection-timeout: 50ms
    listener:
      simple:
        auto-startup: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

eureka:
  client:
    enabled: false

logitrack:
  fee:
    base: 1000.00
    price-per-kg: 250.00
    volumetric-divisor: 5000
  courier:
    service-id: courier-service
    connect-timeout: 200ms
    read-timeout: 300ms
