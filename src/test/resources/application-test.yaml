spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:logitrack;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

logitrack:
  fee:
    base: 1000.00
    price-per-kg: 250.00
    volumetric-divisor: 5000
  courier:
    base-url: http://127.0.0.1:1
    connect-timeout: 200ms
    read-timeout: 300ms
