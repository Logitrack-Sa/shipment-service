services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-logitrack}
      MYSQL_USER: ${DB_USER:-logitrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
