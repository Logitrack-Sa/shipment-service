spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:logitrack;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    enabled: false

logitrack:
  fee:
    base: 1000.00
    price-per-kg: 250.00
    volumetric-divisor: 5000
  courier:
    service-id: courier-service
    connect-timeout: 200ms
    read-timeout: 300ms
  cache:
    couriers-available:
      ttl-seconds: 300
      key-prefix: "couriers::available"
