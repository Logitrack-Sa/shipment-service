name: Integración completa de LogiTrack
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/**'
      - 'integration/**'
      - '.github/workflows/stack.yml'
permissions:
  contents: read
concurrency:
  group: platform-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
      JAVA_TOOL_OPTIONS: '-Xmx512m -XX:ActiveProcessorCount=2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: shipment-service
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: shipment-service/pom.xml
      - name: Obtener fuentes compatibles de toda la plataforma
        run: python shipment-service/integration/stack_sources.py --workspace . --clone
      - name: Probar los servicios Java
        run: |
          for service in config-server eureka-server security-service courier-service shipment-service api-gateway chatbot-service payment-service; do
            (cd "$service" && chmod +x mvnw && ./mvnw --batch-mode --no-transfer-progress test)
          done
      - name: Validar configuración y preparar secretos efímeros
        working-directory: deploy
        run: |
          python -m unittest discover -s ../config-repo/tests -v
          python scripts/prepare_local.py --directory target/ci
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('target/ci/runtime.env')
          values=dict(line.split('=',1) for line in path.read_text().splitlines() if line)
          values['CONFIG_GIT_LABEL']=json.loads(pathlib.Path('../shipment-service/deploy/stack-sources.json').read_text())['config-repo']
          path.write_text(''.join(k+'='+v+'\n' for k,v in values.items()))
          PY
          docker compose --env-file target/ci/runtime.env -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - name: Construir y arrancar la instalación completa
        working-directory: deploy
        run: docker compose --env-file target/ci/runtime.env -f docker-compose.yml -f docker-compose.local.yml up -d --build --wait --wait-timeout 600
      - name: Comprobar registro, correo, permisos, envíos y repartidores
        working-directory: deploy
        run: python scripts/verify_local.py --directory target/ci
      - name: Conservar reporte sin credenciales
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-integration-report
          path: deploy/target/ci/verification.json
          if-no-files-found: ignore
      - name: Retirar únicamente el entorno descartable de CI
        if: always()
        working-directory: deploy
        run: |
          if [ -f target/ci/runtime.env ]; then
            docker compose --env-file target/ci/runtime.env -f docker-compose.yml -f docker-compose.local.yml down --volumes --remove-orphans
          fi

