
services:
  mysql:
    image: mysql:8.4
    container_name: shipment-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shipment_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USER:-shipment_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shipment_password}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shipment-net

  shipment-service:
    build: .
    container_name: shipment-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${DB_NAME:-shipment_db}?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-shipment_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-shipment_password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shipment-net

volumes:
  mysql_data:

networks:
  shipment-net:
    driver: bridge
