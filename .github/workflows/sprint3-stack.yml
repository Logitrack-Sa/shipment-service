name: Integracion distribuida Sprint 3
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/**'
      - 'integration/**'
      - '.github/workflows/sprint3-stack.yml'
permissions:
  contents: read
concurrency:
  group: sprint3-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: shipment-service
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: shipment-service/pom.xml
      - name: Obtener fuentes compatibles
        run: python shipment-service/integration/sprint3_sources.py --workspace . --clone
      - name: Probar y empaquetar las seis aplicaciones
        shell: bash
        run: |
          for service in config-server eureka-server security-service courier-service shipment-service api-gateway; do
            (cd "$service" && chmod +x mvnw && ./mvnw --batch-mode --no-transfer-progress package)
          done
      - name: Validar contratos y construir imagenes
        working-directory: shipment-service
        run: |
          python -m unittest discover -s ../config-repo/tests -v
          python -m unittest discover -s integration -p test_sprint3_compose.py -v
          python -m unittest discover -s integration -p test_gateway_recovery.py -v
          python integration/build_sprint3.py --workspace .. --temporary "$RUNNER_TEMP/sprint3-build"
          CONFIG_LABEL=$(python -c "import json; print(json.load(open('deploy/sprint3-sources.json'))['config-repo'])")
          python integration/prepare_sprint3.py --config-label "$CONFIG_LABEL"
      - name: Arrancar los nueve contenedores
        working-directory: shipment-service
        run: docker compose --env-file target/sprint3/runtime.env -f deploy/docker-compose.yml -p logitrack-sprint3-ci up -d --no-build --wait --wait-timeout 900
      - name: Probar rutas publicas, roles, CORS, Feign y caida de courier
        working-directory: shipment-service
        run: python integration/verify_sprint3.py --project logitrack-sprint3-ci --allow-courier-stop
      - name: Ejecutar la coleccion de Postman
        working-directory: shipment-service
        run: |
          python integration/export_sprint3_postman.py
          npx --yes newman@6.2.1 run postman/LogiTrack_Sprint3.postman_collection.json -e target/sprint3/postman.environment.json --bail --ignore-redirects --timeout-request 15000 --reporters cli,junit --reporter-junit-export target/sprint3/postman-results.xml
      - name: Conservar solo el reporte sin credenciales
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sprint3-integration-report
          path: |
            shipment-service/target/sprint3/report.json
            shipment-service/target/sprint3/postman-results.xml
          if-no-files-found: ignore
      - name: Retirar el entorno descartable de CI
        if: always()
        working-directory: shipment-service
        run: |
          if [ -f target/sprint3/runtime.env ]; then
            docker compose --env-file target/sprint3/runtime.env -f deploy/docker-compose.yml -p logitrack-sprint3-ci down --volumes --remove-orphans
          fi
