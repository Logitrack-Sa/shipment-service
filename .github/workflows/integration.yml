name: Integración distribuida manual
on:
  workflow_dispatch:
    inputs:
      compose_file:
        description: Compose image-only versionado en main (entrega de issues 64/65)
        default: compose.release.yaml
        required: true
        type: string
permissions:
  contents: read
jobs:
  integration:
    name: Cuatro servicios reales e imágenes publicadas
    runs-on: ubuntu-latest
    environment: sprint2-integration
    timeout-minutes: 20
    env:
      COMPOSE_FILE: ${{ inputs.compose_file }}
      COMPOSE_PROJECT_NAME: logitrack-e2e-actions
      E2E_SHIPMENT_URL: http://localhost:8081
      E2E_COURIER_URL: http://localhost:8082
      E2E_SECURITY_URL: http://localhost:8083
      E2E_CONFIG_URL: http://localhost:8888
      E2E_ADMIN_USERNAME: ${{ vars.E2E_ADMIN_USERNAME }}
      E2E_CLIENT_A_USERNAME: ${{ vars.E2E_CLIENT_A_USERNAME }}
      E2E_CLIENT_B_USERNAME: ${{ vars.E2E_CLIENT_B_USERNAME }}
      E2E_COURIER_A_USERNAME: ${{ vars.E2E_COURIER_A_USERNAME }}
      E2E_COURIER_B_USERNAME: ${{ vars.E2E_COURIER_B_USERNAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_CLIENT_A_PASSWORD: ${{ secrets.E2E_CLIENT_A_PASSWORD }}
      E2E_CLIENT_B_PASSWORD: ${{ secrets.E2E_CLIENT_B_PASSWORD }}
      E2E_COURIER_A_PASSWORD: ${{ secrets.E2E_COURIER_A_PASSWORD }}
      E2E_COURIER_B_PASSWORD: ${{ secrets.E2E_COURIER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verificar manifiesto y Compose de entrega
        id: prerequisites
        run: python3 integration/preflight.py "$COMPOSE_FILE"
      - name: Descargar y arrancar sin build local
        run: |
          docker compose pull
          docker compose up --no-build --wait
      - name: Ejecutar escenarios (restaura courier después de detenerlo)
        run: python3 integration/run.py --manifest docs/sprint2/examples/integration.json --compose-file "$COMPOSE_FILE" --project "$COMPOSE_PROJECT_NAME" --allow-courier-stop
      - name: Publicar resumen sin credenciales
        if: always()
        run: python3 integration/summary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integracion-real
          path: target/integration/report.json
          if-no-files-found: warn
      - name: Detener entorno de prueba sin borrar volúmenes
        if: always() && steps.prerequisites.outcome == 'success'
        run: docker compose stop
