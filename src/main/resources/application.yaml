spring:
  application:
    name: shipment-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
